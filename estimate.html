<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Estimate Builder — Hampton Headstone Care</title>
  <meta name="robots" content="noindex, nofollow" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>

  <style>
    :root {
      --forest: #2C4A2E;
      --moss: #4A6741;
      --cream: #F5F0E6;
      --gold: #B8962E;
      --stone: #6B5F4F;
      --rule: #D4CFC4;
    }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--cream); font-family: 'Jost', sans-serif; color: var(--forest); }
    .display { font-family: 'Cormorant Garamond', serif; }
    .eyebrow { font-family: 'Jost', sans-serif; font-size: 10px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--stone); }
    .body-text { font-family: 'Jost', sans-serif; font-size: 13px; line-height: 1.6; color: var(--stone); }
    input, textarea, select, button { font-family: 'Jost', sans-serif; }
    input:focus, textarea:focus { outline: none; }
    .stone-card { background: white; border: 1px solid var(--rule); margin-bottom: 10px; transition: border-color 0.15s; }
    .stone-card:hover { border-color: var(--stone); }
    .toggle-btn { cursor: pointer; border: 1px solid var(--rule); background: white; padding: 6px 12px; font-size: 11px; letter-spacing: 0.06em; color: var(--stone); transition: all 0.15s; }
    .toggle-btn.active { background: var(--forest); border-color: var(--forest); color: var(--cream); }
    .toggle-btn:hover:not(.active) { border-color: var(--forest); color: var(--forest); }
    .add-stone-btn { cursor: pointer; border: 1px dashed var(--rule); background: transparent; padding: 12px 18px; font-size: 12px; letter-spacing: 0.06em; color: var(--stone); transition: all 0.15s; }
    .add-stone-btn:hover { border-color: var(--forest); color: var(--forest); background: rgba(44,74,46,0.03); }
    .tab { cursor: pointer; padding: 8px 20px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; border: none; background: none; border-bottom: 2px solid transparent; transition: all 0.15s; }
    .field-label { font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--stone); display: block; margin-bottom: 5px; }
    .field-input { width: 100%; border: 1px solid var(--rule); background: white; padding: 10px 12px; font-size: 13px; color: var(--forest); transition: border-color 0.15s; }
    .field-input:focus { border-color: var(--forest); }
    .section-head { font-family: 'Cormorant Garamond', serif; font-size: 22px; color: var(--forest); margin: 0 0 14px 0; }
    .divider { border: none; border-top: 1px solid var(--rule); margin: 24px 0; }
    .remove-btn { cursor: pointer; background: none; border: none; color: var(--rule); font-size: 22px; line-height: 1; padding: 0 4px; transition: color 0.15s; }
    .remove-btn:hover { color: #c0392b; }
    .primary-btn { cursor: pointer; background: var(--forest); color: var(--cream); border: none; padding: 12px 28px; font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; transition: background 0.15s; }
    .primary-btn:hover { background: var(--moss); }
    .secondary-btn { cursor: pointer; background: white; border: 1px solid var(--rule); padding: 11px 20px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--stone); transition: all 0.15s; }
    .secondary-btn:hover { border-color: var(--forest); color: var(--forest); }

    /* HHC wordmark logo */
    .hhc-mark { fill: currentColor; }

    /* Login screen */
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; background: var(--cream); }
    .login-card { max-width: 380px; width: 100%; background: white; padding: 48px 40px; border: 1px solid var(--rule); }

    /* Print styles */
    @media print {
      body { background: white; }
      .no-print { display: none !important; }
      .print-only { display: block !important; }
      .print-page { padding: 0 !important; max-width: 100% !important; box-shadow: none !important; }
      tr { page-break-inside: avoid; break-inside: avoid; }
      img { max-width: 100%; }
      @page { margin: 0.5in; }
    }
    .print-only { display: none; }

    /* Responsive */
    @media (max-width: 760px) {
      .layout-grid { grid-template-columns: 1fr !important; }
      .summary-sidebar { position: static !important; }
      .stone-buttons { flex-direction: column; }
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // ── Branded HHC Wordmark SVG ────────────────────────────────
    function HHCMark({ color = "#2C4A2E", height = 36 }) {
      // Stylized "HHC" with the cross-bar through them, matching site identity
      return (
        <svg viewBox="0 0 200 70" style={{ height, width: "auto", display: "block" }} xmlns="http://www.w3.org/2000/svg">
          <g fill={color}>
            {/* Letter H */}
            <rect x="10" y="10" width="6" height="55" />
            <rect x="40" y="10" width="6" height="55" />
            {/* Letter H */}
            <rect x="65" y="10" width="6" height="55" />
            <rect x="95" y="10" width="6" height="55" />
            {/* Letter C (open right) */}
            <path d="M 155 10 A 27.5 27.5 0 1 0 155 65 L 155 59 A 21.5 21.5 0 1 1 155 16 Z" />
            {/* Horizontal cross-bar through all letters */}
            <rect x="5" y="35" width="180" height="4" />
          </g>
        </svg>
      );
    }

    // ── Pricing config ──────────────────────────────────────────
    const PRICING = {
      stones: [
        { id: "small", label: "Small", sub: "Single upright · slant · marker", price: 75, maintenance: 150 },
        { id: "medium", label: "Medium", sub: "Double upright · slant · marker", price: 110, maintenance: 220 },
        { id: "large", label: "Large", sub: "Obelisk or monument", price: 150, maintenance: 300 },
      ],
      surcharges: [
        { id: "neglect", label: "Heavy Neglect / Severe Lichen", price: 50 },
        { id: "followup", label: "Second Visit / Follow-Up Clean", price: 40 },
      ],
      addons: [
        { id: "weed", label: "Weeding & Trimming Around Plot", price: 25 },
        { id: "finder", label: "Headstone Finder Listing", price: 0 },
        { id: "flag", label: "Veteran Flag Placement", price: 0 },
        { id: "photos", label: "Before & After Photos", price: 0 },
      ],
    };
    const MULTI_DISCOUNT = 10;
    const CORRECT_PASSWORD = "willywonka";
    const DRAFT_KEY = "hhc_estimate_draft";

    // Format relative time for "saved X ago"
    function timeAgo(iso) {
      if (!iso) return "";
      const secs = Math.floor((Date.now() - new Date(iso).getTime()) / 1000);
      if (secs < 5) return "just now";
      if (secs < 60) return `${secs}s ago`;
      const mins = Math.floor(secs / 60);
      if (mins < 60) return `${mins}m ago`;
      const hrs = Math.floor(mins / 60);
      if (hrs < 24) return `${hrs}h ago`;
      return new Date(iso).toLocaleDateString();
    }

    // ── Login Screen ───────────────────────────────────────────
    function Login({ onSuccess }) {
      const [pw, setPw] = useState("");
      const [err, setErr] = useState(false);

      function handleSubmit(e) {
        e.preventDefault();
        if (pw === CORRECT_PASSWORD) {
          sessionStorage.setItem("hhc_estimate_auth", "1");
          onSuccess();
        } else {
          setErr(true);
          setPw("");
        }
      }

      return (
        <div className="login-wrap">
          <form className="login-card" onSubmit={handleSubmit}>
            <div style={{ display: "flex", justifyContent: "center", marginBottom: 24 }}>
              <HHCMark color="#2C4A2E" height={42} />
            </div>
            <div className="display" style={{ fontSize: 26, color: "var(--forest)", textAlign: "center", marginBottom: 4 }}>
              Estimate Builder
            </div>
            <p className="body-text" style={{ textAlign: "center", marginBottom: 28 }}>
              Internal tool — password required.
            </p>
            <label className="field-label">Password</label>
            <input
              className="field-input"
              type="password"
              value={pw}
              onChange={(e) => { setPw(e.target.value); setErr(false); }}
              autoFocus
              style={err ? { borderColor: "#c0392b" } : {}}
            />
            {err && <p style={{ color: "#c0392b", fontSize: 12, marginTop: 8, marginBottom: 0 }}>Incorrect password.</p>}
            <button type="submit" className="primary-btn" style={{ width: "100%", marginTop: 20 }}>
              Enter
            </button>
          </form>
        </div>
      );
    }

    // ── Main App ───────────────────────────────────────────────
    function App() {
      const [authed, setAuthed] = useState(() => sessionStorage.getItem("hhc_estimate_auth") === "1");
      if (!authed) return <Login onSuccess={() => setAuthed(true)} />;
      return <EstimateBuilder onLogout={() => { sessionStorage.removeItem("hhc_estimate_auth"); setAuthed(false); }} />;
    }

    function EstimateBuilder({ onLogout }) {
      const today = new Date().toISOString().split("T")[0];
      const [client, setClient] = useState({ name: "", cemetery: "", date: today, notes: "" });
      const [stones, setStones] = useState([]);
      const [view, setView] = useState("build");

      // Sequential estimate counter — stored in localStorage, padded to 4 digits
      const [estimateNum, setEstimateNum] = useState(() => {
        const stored = parseInt(localStorage.getItem("hhc_next_estimate_num") || "1", 10);
        return isNaN(stored) || stored < 1 ? 1 : stored;
      });
      const [editingNum, setEditingNum] = useState(false);
      const estimateNumber = `HHC-${String(estimateNum).padStart(4, "0")}`;

      function saveEstimateNum(n) {
        const clean = Math.max(1, parseInt(n, 10) || 1);
        setEstimateNum(clean);
        localStorage.setItem("hhc_next_estimate_num", String(clean));
      }

      // Validity date — 30 days from estimate date
      const validUntil = (() => {
        const d = new Date(client.date);
        d.setDate(d.getDate() + 30);
        return d.toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" });
      })();

      // ── Auto-save / draft restore ──────────────────────────────
      // On mount, check for a saved draft with actual content
      const [pendingDraft, setPendingDraft] = useState(() => {
        try {
          const raw = localStorage.getItem(DRAFT_KEY);
          if (!raw) return null;
          const parsed = JSON.parse(raw);
          if (parsed.client?.name || parsed.client?.cemetery || parsed.client?.notes || (parsed.stones?.length > 0)) {
            return parsed;
          }
          return null;
        } catch { return null; }
      });
      const [lastSaved, setLastSaved] = useState(null);
      const [savedTick, setSavedTick] = useState(0); // forces re-render so "X seconds ago" updates

      // Debounced auto-save whenever client or stones change
      useEffect(() => {
        const hasContent = client.name || client.cemetery || client.notes || stones.length > 0;
        if (!hasContent) return;
        const t = setTimeout(() => {
          const now = new Date().toISOString();
          const payload = { savedAt: now, client, stones };
          try {
            localStorage.setItem(DRAFT_KEY, JSON.stringify(payload));
            setLastSaved({ at: now, photosOmitted: false });
          } catch (e) {
            // Quota exceeded — most likely too many/large photos. Save form data without photos.
            try {
              const stonesNoPhotos = stones.map(st => ({ ...st, photos: [] }));
              localStorage.setItem(DRAFT_KEY, JSON.stringify({ savedAt: now, client, stones: stonesNoPhotos, photosOmitted: true }));
              setLastSaved({ at: now, photosOmitted: true });
            } catch {
              setLastSaved({ at: now, failed: true });
            }
          }
        }, 800);
        return () => clearTimeout(t);
      }, [client, stones]);

      // Tick once a minute so the "saved X ago" label stays fresh
      useEffect(() => {
        const i = setInterval(() => setSavedTick(t => t + 1), 30000);
        return () => clearInterval(i);
      }, []);

      function restoreDraft() {
        if (!pendingDraft) return;
        setClient(pendingDraft.client);
        setStones(pendingDraft.stones || []);
        setPendingDraft(null);
      }
      function discardDraft() {
        localStorage.removeItem(DRAFT_KEY);
        setPendingDraft(null);
        setLastSaved(null);
      }
      function clearAll() {
        if (!confirm("Start a new estimate? Current work will be cleared.")) return;
        localStorage.removeItem(DRAFT_KEY);
        setClient({ name: "", cemetery: "", date: today, notes: "" });
        setStones([]);
        setLastSaved(null);
        setPendingDraft(null);
        setView("build");
      }

      function addStone(typeId) {
        setStones(s => [...s, { id: Date.now() + Math.random(), type: typeId, name: "", surcharges: [], addons: [], maintenance: false, photos: [] }]);
      }
      function removeStone(id) {
        setStones(s => s.filter(st => st.id !== id));
      }
      function updateStoneName(stoneId, name) {
        setStones(s => s.map(st => st.id === stoneId ? { ...st, name } : st));
      }
      function toggleStoneSurcharge(stoneId, surchargeId) {
        setStones(s => s.map(st => {
          if (st.id !== stoneId) return st;
          const has = st.surcharges.includes(surchargeId);
          return { ...st, surcharges: has ? st.surcharges.filter(x => x !== surchargeId) : [...st.surcharges, surchargeId] };
        }));
      }
      function toggleStoneAddon(stoneId, addonId) {
        setStones(s => s.map(st => {
          if (st.id !== stoneId) return st;
          const has = st.addons.includes(addonId);
          return { ...st, addons: has ? st.addons.filter(x => x !== addonId) : [...st.addons, addonId] };
        }));
      }
      function toggleStoneMaintenance(stoneId) {
        setStones(s => s.map(st => st.id === stoneId ? { ...st, maintenance: !st.maintenance } : st));
      }

      // ── Photo handling ─────────────────────────────────────────
      // Compress images on upload — resize to max 1400px wide, JPEG quality 0.75
      // Use createImageBitmap with imageOrientation:'from-image' to handle iPhone EXIF rotation correctly
      async function compressImage(file) {
        try {
          const bitmap = await createImageBitmap(file, { imageOrientation: "from-image" });
          const maxWidth = 1400;
          const ratio = Math.min(1, maxWidth / bitmap.width);
          const w = Math.round(bitmap.width * ratio);
          const h = Math.round(bitmap.height * ratio);
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(bitmap, 0, 0, w, h);
          bitmap.close && bitmap.close();
          return canvas.toDataURL("image/jpeg", 0.75);
        } catch (e) {
          // Fallback for older browsers without createImageBitmap orientation support
          return await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
          });
        }
      }

      async function addStonePhotos(stoneId, fileList) {
        const files = Array.from(fileList).filter(f => f.type.startsWith("image/"));
        if (files.length === 0) return;
        const compressed = await Promise.all(files.map(async f => ({
          id: Date.now() + Math.random(),
          dataUrl: await compressImage(f),
        })));
        setStones(s => s.map(st => st.id === stoneId ? { ...st, photos: [...st.photos, ...compressed] } : st));
      }

      function removeStonePhoto(stoneId, photoId) {
        setStones(s => s.map(st => st.id === stoneId ? { ...st, photos: st.photos.filter(p => p.id !== photoId) } : st));
      }

      const multiDiscount = stones.length >= 3;
      function stoneTotal(st) {
        const base = PRICING.stones.find(s => s.id === st.type);
        const basePrice = (base?.price ?? 0) - (multiDiscount ? MULTI_DISCOUNT : 0);
        const surchargeTotal = st.surcharges.reduce((sum, sid) => {
          const s = PRICING.surcharges.find(s => s.id === sid);
          return sum + (s?.price ?? 0);
        }, 0);
        const addonTotal = st.addons.reduce((sum, aid) => {
          const a = PRICING.addons.find(a => a.id === aid);
          return sum + (a?.price ?? 0);
        }, 0);
        return basePrice + surchargeTotal + addonTotal;
      }
      function stoneMaintenancePrice(st) {
        if (!st.maintenance) return 0;
        const base = PRICING.stones.find(s => s.id === st.type);
        return base?.maintenance ?? 0;
      }
      const stonesSubtotal = stones.reduce((sum, st) => sum + stoneTotal(st), 0);
      const maintenanceSubtotal = stones.reduce((sum, st) => sum + stoneMaintenancePrice(st), 0);
      const oneTimeTotal = stonesSubtotal;
      const annualTotal = maintenanceSubtotal;

      function handlePrint() {
        // Set document title so the browser uses it as the default PDF filename
        const safeName = (client.name || "Estimate").replace(/[^\w\s-]/g, "").trim() || "Estimate";
        const originalTitle = document.title;
        document.title = `${safeName} - ${client.date}`;
        window.print();
        // Bump the counter so next estimate gets the next number
        saveEstimateNum(estimateNum + 1);
        // Restore title after print dialog closes
        setTimeout(() => { document.title = originalTitle; }, 1000);
      }

      return (
        <div style={{ minHeight: "100vh", background: "var(--cream)" }}>
          {/* Header */}
          <div className="no-print" style={{ background: "var(--forest)", padding: "14px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
            <div style={{ display: "flex", alignItems: "center", gap: 14, flexWrap: "wrap" }}>
              <HHCMark color="#F5F0E6" height={26} />
              <span className="eyebrow" style={{ color: "rgba(245,240,230,0.55)" }}>Estimate Builder</span>
              <span style={{ fontSize: 10, color: "rgba(245,240,230,0.4)", letterSpacing: "0.08em", borderLeft: "1px solid rgba(245,240,230,0.2)", paddingLeft: 12 }}>Next: {estimateNumber}</span>
              {lastSaved && (
                <span style={{ fontSize: 10, color: lastSaved.failed ? "#e8a48a" : lastSaved.photosOmitted ? "#e8c98a" : "rgba(245,240,230,0.55)", letterSpacing: "0.06em", display: "flex", alignItems: "center", gap: 5 }} title={lastSaved.failed ? "Auto-save failed — storage may be full" : lastSaved.photosOmitted ? "Form data saved, but photos couldn't fit in storage. Photos won't be restored if you reload." : "Auto-saved to this browser"}>
                  <span style={{ width: 6, height: 6, borderRadius: "50%", background: lastSaved.failed ? "#e8a48a" : lastSaved.photosOmitted ? "#e8c98a" : "#7eb87e", display: "inline-block" }}></span>
                  {lastSaved.failed ? "Save failed" : lastSaved.photosOmitted ? `Saved ${timeAgo(lastSaved.at)} (photos not saved)` : `Saved ${timeAgo(lastSaved.at)}`}
                  <span style={{ display: "none" }}>{savedTick}</span>
                </span>
              )}
            </div>
            <div style={{ display: "flex", gap: 0, alignItems: "center" }}>
              <button
                onClick={clearAll}
                style={{ background: "none", border: "1px solid rgba(245,240,230,0.25)", color: "rgba(245,240,230,0.75)", padding: "6px 12px", marginRight: 16, cursor: "pointer", fontSize: 10, letterSpacing: "0.1em", textTransform: "uppercase" }}
              >+ New</button>
              <button
                className="tab"
                style={{ color: view === "build" ? "var(--cream)" : "rgba(245,240,230,0.5)", borderBottomColor: view === "build" ? "var(--gold)" : "transparent" }}
                onClick={() => setView("build")}
              >Build</button>
              <button
                className="tab"
                style={{ color: view === "preview" ? "var(--cream)" : "rgba(245,240,230,0.5)", borderBottomColor: view === "preview" ? "var(--gold)" : "transparent" }}
                onClick={() => setView("preview")}
              >Preview</button>
              <button
                onClick={onLogout}
                style={{ background: "none", border: "none", color: "rgba(245,240,230,0.4)", marginLeft: 16, cursor: "pointer", fontSize: 11, letterSpacing: "0.1em", textTransform: "uppercase" }}
              >Log out</button>
            </div>
          </div>

          {/* ── BUILD VIEW ─────────────────────────────────── */}
          {view === "build" && (
            <div>
              {pendingDraft && (
                <div className="no-print" style={{ background: "white", borderBottom: "1px solid var(--rule)", padding: "14px 28px", display: "flex", alignItems: "center", justifyContent: "space-between", flexWrap: "wrap", gap: 12 }}>
                  <div style={{ display: "flex", alignItems: "center", gap: 14 }}>
                    <span style={{ width: 8, height: 8, borderRadius: "50%", background: "var(--gold)", display: "inline-block" }}></span>
                    <div>
                      <div style={{ fontSize: 13, color: "var(--forest)", fontWeight: 500 }}>
                        Draft from {timeAgo(pendingDraft.savedAt)} found
                      </div>
                      <div style={{ fontSize: 11, color: "var(--stone)", marginTop: 2 }}>
                        {pendingDraft.client?.name ? `${pendingDraft.client.name} · ` : ""}
                        {pendingDraft.stones?.length || 0} stone{pendingDraft.stones?.length === 1 ? "" : "s"}
                        {pendingDraft.photosOmitted && " · photos were not saved"}
                      </div>
                    </div>
                  </div>
                  <div style={{ display: "flex", gap: 8 }}>
                    <button className="secondary-btn" onClick={discardDraft} style={{ fontSize: 10 }}>Discard</button>
                    <button className="primary-btn" onClick={restoreDraft} style={{ padding: "10px 20px", fontSize: 10 }}>Restore Draft</button>
                  </div>
                </div>
              )}
              <div className="layout-grid" style={{ maxWidth: 980, margin: "0 auto", padding: "32px 20px", display: "grid", gridTemplateColumns: "1fr 320px", gap: 28, alignItems: "start" }}>
              <div>
                <h3 className="section-head">Client Information</h3>
                <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr", gap: 12, marginBottom: 12 }}>
                  <div>
                    <label className="field-label">Client Name</label>
                    <input className="field-input" value={client.name} onChange={e => setClient(c => ({ ...c, name: e.target.value }))} placeholder="Margaret Whitmore" />
                  </div>
                  <div>
                    <label className="field-label">Cemetery</label>
                    <input className="field-input" value={client.cemetery} onChange={e => setClient(c => ({ ...c, cemetery: e.target.value }))} placeholder="Cedar Lawn Cemetery" />
                  </div>
                  <div style={{ gridColumn: "1 / -1" }}>
                    <label className="field-label">Date</label>
                    <input className="field-input" type="date" value={client.date} onChange={e => setClient(c => ({ ...c, date: e.target.value }))} />
                  </div>
                </div>
                <div>
                  <label className="field-label">Notes</label>
                  <textarea className="field-input" rows={2} value={client.notes} onChange={e => setClient(c => ({ ...c, notes: e.target.value }))} placeholder="Location, access notes, special instructions…" style={{ resize: "vertical", fontFamily: "'Jost', sans-serif" }} />
                </div>

                <hr className="divider" />

                <div style={{ display: "flex", alignItems: "baseline", justifyContent: "space-between", marginBottom: 14 }}>
                  <h3 className="section-head" style={{ margin: 0 }}>Stones</h3>
                  {multiDiscount && <span style={{ fontSize: 11, color: "var(--forest)", letterSpacing: "0.06em", fontWeight: 500 }}>−$10/stone multi-stone discount applied</span>}
                </div>

                {stones.length === 0 && (
                  <p className="body-text" style={{ fontStyle: "italic", marginBottom: 14 }}>No stones added yet.</p>
                )}

                {stones.map((st, idx) => {
                  const typeDef = PRICING.stones.find(s => s.id === st.type);
                  return (
                    <div key={st.id} className="stone-card" style={{ padding: 16 }}>
                      <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", marginBottom: 12, gap: 12 }}>
                        <div style={{ flex: 1, minWidth: 0 }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 6 }}>
                            <span className="eyebrow" style={{ background: "var(--cream)", padding: "2px 8px" }}>#{idx + 1}</span>
                            <span style={{ fontSize: 11, color: "var(--stone)", letterSpacing: "0.04em" }}>{typeDef?.label} · {typeDef?.sub}</span>
                          </div>
                          <input
                            className="field-input"
                            value={st.name}
                            onChange={e => updateStoneName(st.id, e.target.value)}
                            placeholder="Stone name or identifier (e.g. Robert F. Daniels, Father's stone)"
                            style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 18, color: "var(--forest)", padding: "6px 10px" }}
                          />
                        </div>
                        <div style={{ display: "flex", alignItems: "center", gap: 12, paddingTop: 24 }}>
                          <span className="display" style={{ fontSize: 24, color: "var(--forest)" }}>${stoneTotal(st)}</span>
                          <button className="remove-btn" onClick={() => removeStone(st.id)} title="Remove stone">×</button>
                        </div>
                      </div>

                      <div style={{ marginBottom: 10 }}>
                        <span className="eyebrow" style={{ display: "block", marginBottom: 6 }}>Surcharges</span>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                          {PRICING.surcharges.map(s => (
                            <button key={s.id} className={`toggle-btn ${st.surcharges.includes(s.id) ? "active" : ""}`} onClick={() => toggleStoneSurcharge(st.id, s.id)}>
                              {s.label} +${s.price}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div style={{ marginBottom: 10 }}>
                        <span className="eyebrow" style={{ display: "block", marginBottom: 6 }}>Add-ons</span>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
                          {PRICING.addons.map(a => (
                            <button key={a.id} className={`toggle-btn ${st.addons.includes(a.id) ? "active" : ""}`} onClick={() => toggleStoneAddon(st.id, a.id)}>
                              {a.label} {a.price > 0 ? `+$${a.price}` : "(Free)"}
                            </button>
                          ))}
                        </div>
                      </div>

                      <div>
                        <span className="eyebrow" style={{ display: "block", marginBottom: 6 }}>Annual Maintenance</span>
                        <button className={`toggle-btn ${st.maintenance ? "active" : ""}`} onClick={() => toggleStoneMaintenance(st.id)}>
                          Add Annual Plan — ${typeDef?.maintenance}/yr
                        </button>
                        {st.maintenance && <span style={{ fontSize: 10, color: "var(--stone)", marginLeft: 8, fontStyle: "italic" }}>Two visits/yr · spring & fall</span>}
                      </div>

                      <div style={{ marginTop: 14, paddingTop: 12, borderTop: "1px dashed var(--rule)" }}>
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8 }}>
                          <span className="eyebrow">Photos {st.photos.length > 0 && `(${st.photos.length})`}</span>
                          <label className="toggle-btn" style={{ cursor: "pointer" }}>
                            + Add Photos
                            <input
                              type="file"
                              accept="image/*"
                              multiple
                              style={{ display: "none" }}
                              onChange={async (e) => {
                                await addStonePhotos(st.id, e.target.files);
                                e.target.value = ""; // reset so same file can be re-selected
                              }}
                            />
                          </label>
                        </div>
                        {st.photos.length === 0 ? (
                          <p style={{ fontSize: 11, color: "var(--stone)", fontStyle: "italic", margin: 0 }}>No photos attached. Optional — useful for identifying which stone is which.</p>
                        ) : (
                          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(80px, 1fr))", gap: 6 }}>
                            {st.photos.map(p => (
                              <div key={p.id} style={{ position: "relative", paddingBottom: "100%", background: "var(--cream)", border: "1px solid var(--rule)" }}>
                                <img src={p.dataUrl} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover" }} />
                                <button
                                  onClick={() => removeStonePhoto(st.id, p.id)}
                                  title="Remove photo"
                                  style={{ position: "absolute", top: 2, right: 2, width: 20, height: 20, background: "rgba(44,74,46,0.85)", color: "white", border: "none", borderRadius: "50%", cursor: "pointer", fontSize: 14, lineHeight: 1, padding: 0 }}
                                >×</button>
                              </div>
                            ))}
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}

                <div className="stone-buttons" style={{ display: "flex", gap: 8, marginTop: 10 }}>
                  {PRICING.stones.map(s => (
                    <button key={s.id} className="add-stone-btn" style={{ flex: 1 }} onClick={() => addStone(s.id)}>
                      + Add {s.label} (${s.price})
                    </button>
                  ))}
                </div>
              </div>

              {/* Summary sidebar */}
              <div className="summary-sidebar" style={{ position: "sticky", top: 20 }}>
                <div style={{ background: "var(--forest)", color: "var(--cream)", padding: "24px 22px" }}>
                  <div className="eyebrow" style={{ color: "rgba(245,240,230,0.55)", marginBottom: 4 }}>Estimate Summary</div>
                  <div className="display" style={{ fontSize: 26, color: "var(--cream)", marginBottom: 20 }}>{client.name || "—"}</div>

                  {stones.length === 0 && (
                    <p style={{ fontSize: 12, color: "rgba(245,240,230,0.5)", fontStyle: "italic", margin: 0 }}>Add stones to begin.</p>
                  )}

                  {stones.map((st, idx) => {
                    const typeDef = PRICING.stones.find(s => s.id === st.type);
                    const label = st.name.trim() || `Stone ${idx + 1}`;
                    return (
                      <div key={st.id} style={{ paddingBottom: 10, marginBottom: 10, borderBottom: "1px solid rgba(245,240,230,0.12)" }}>
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", gap: 8 }}>
                          <div style={{ minWidth: 0, flex: 1 }}>
                            <div style={{ fontSize: 12, overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{label}</div>
                            <div style={{ fontSize: 10, color: "rgba(245,240,230,0.5)", letterSpacing: "0.04em" }}>#{idx + 1} · {typeDef?.label}</div>
                          </div>
                          <span style={{ fontSize: 12, color: "var(--gold)", whiteSpace: "nowrap" }}>
                            ${(typeDef?.price ?? 0) - (multiDiscount ? MULTI_DISCOUNT : 0)}
                          </span>
                        </div>
                        {st.surcharges.map(sid => {
                          const s = PRICING.surcharges.find(s => s.id === sid);
                          return <div key={sid} style={{ display: "flex", justifyContent: "space-between", paddingLeft: 10, marginTop: 3 }}>
                            <span style={{ fontSize: 11, color: "rgba(245,240,230,0.6)" }}>{s?.label}</span>
                            <span style={{ fontSize: 11, color: "rgba(245,240,230,0.6)" }}>+${s?.price}</span>
                          </div>;
                        })}
                        {st.addons.filter(aid => PRICING.addons.find(a => a.id === aid)?.price > 0).map(aid => {
                          const a = PRICING.addons.find(a => a.id === aid);
                          return <div key={aid} style={{ display: "flex", justifyContent: "space-between", paddingLeft: 10, marginTop: 3 }}>
                            <span style={{ fontSize: 11, color: "rgba(245,240,230,0.6)" }}>{a?.label}</span>
                            <span style={{ fontSize: 11, color: "rgba(245,240,230,0.6)" }}>+${a?.price}</span>
                          </div>;
                        })}
                        {st.maintenance && (
                          <div style={{ display: "flex", justifyContent: "space-between", paddingLeft: 10, marginTop: 3 }}>
                            <span style={{ fontSize: 11, color: "rgba(245,240,230,0.6)" }}>Annual Plan</span>
                            <span style={{ fontSize: 11, color: "rgba(245,240,230,0.6)" }}>${typeDef?.maintenance}/yr</span>
                          </div>
                        )}
                      </div>
                    );
                  })}

                  <div style={{ borderTop: "1px solid rgba(245,240,230,0.25)", paddingTop: 14, marginTop: 6 }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: annualTotal > 0 ? 10 : 0 }}>
                      <span className="eyebrow" style={{ color: "rgba(245,240,230,0.55)" }}>One-time</span>
                      <span className="display" style={{ fontSize: 36, color: "var(--gold)" }}>${oneTimeTotal}</span>
                    </div>
                    {annualTotal > 0 && (
                      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", paddingTop: 8, borderTop: "1px solid rgba(245,240,230,0.12)" }}>
                        <span className="eyebrow" style={{ color: "rgba(245,240,230,0.55)" }}>Annual maintenance</span>
                        <span className="display" style={{ fontSize: 22, color: "var(--gold)" }}>${annualTotal}<span style={{ fontSize: 12 }}>/yr</span></span>
                      </div>
                    )}
                  </div>
                </div>

                <button className="primary-btn" style={{ width: "100%", marginTop: 1 }} onClick={() => setView("preview")}>
                  Preview Estimate →
                </button>
              </div>
            </div>
            </div>
          )}

          {/* ── PREVIEW VIEW ─────────────────────────────── */}
          {view === "preview" && (
            <div>
              <div className="no-print" style={{ background: "white", borderBottom: "1px solid var(--rule)", padding: "12px 28px", display: "flex", gap: 12, alignItems: "center" }}>
                <button className="primary-btn" onClick={handlePrint}>Print / Save PDF</button>
                <button className="secondary-btn" onClick={() => setView("build")}>← Edit</button>
                {client.name && (
                  <span style={{ marginLeft: "auto", fontSize: 11, color: "var(--stone)", letterSpacing: "0.06em" }}>
                    Will save as: <strong style={{ color: "var(--forest)" }}>{client.name.replace(/[^\w\s-]/g, "").trim()} - {client.date}.pdf</strong>
                  </span>
                )}
              </div>

              <div className="print-page" style={{ maxWidth: 720, margin: "32px auto", padding: "56px 48px", background: "white", boxShadow: "0 2px 20px rgba(0,0,0,0.06)" }}>
                {/* Letterhead */}
                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "flex-start", marginBottom: 40, paddingBottom: 28, borderBottom: "2px solid var(--forest)" }}>
                  <div>
                    <HHCMark color="#2C4A2E" height={44} />
                    <div className="display" style={{ fontSize: 22, color: "var(--forest)", marginTop: 12, marginBottom: 2 }}>Hampton Headstone Care</div>
                    <div style={{ fontSize: 11, color: "var(--stone)", letterSpacing: "0.08em", textTransform: "uppercase" }}>Est. 2026 · East Hampton, NY</div>
                    <div style={{ fontSize: 11, color: "var(--stone)", letterSpacing: "0.06em", marginTop: 6 }}>(631) 604-8002 · hamptonheadstonecare@gmail.com</div>
                    <div style={{ fontSize: 11, color: "var(--stone)", letterSpacing: "0.06em" }}>hamptonheadstonecare.com</div>
                  </div>
                  <div style={{ textAlign: "right" }}>
                    <div className="eyebrow" style={{ marginBottom: 4 }}>Estimate</div>
                    {editingNum ? (
                      <input
                        type="number"
                        min="1"
                        autoFocus
                        defaultValue={estimateNum}
                        onBlur={(e) => { saveEstimateNum(e.target.value); setEditingNum(false); }}
                        onKeyDown={(e) => { if (e.key === "Enter") { saveEstimateNum(e.target.value); setEditingNum(false); } }}
                        className="no-print"
                        style={{ fontFamily: "'Cormorant Garamond', serif", fontSize: 20, color: "var(--forest)", border: "1px solid var(--rule)", padding: "2px 6px", textAlign: "right", width: 130, background: "white" }}
                      />
                    ) : (
                      <div
                        className="display"
                        style={{ fontSize: 20, color: "var(--forest)", cursor: "pointer" }}
                        onClick={() => setEditingNum(true)}
                        title="Click to edit estimate number"
                      >{estimateNumber}</div>
                    )}
                    <div style={{ fontSize: 12, color: "var(--stone)", marginTop: 6 }}>{client.date}</div>
                    <div style={{ fontSize: 10, color: "var(--stone)", marginTop: 2, letterSpacing: "0.04em" }}>Valid through {validUntil}</div>
                  </div>
                </div>

                {/* Client block */}
                <div style={{ marginBottom: 32 }}>
                  <div className="eyebrow" style={{ marginBottom: 8 }}>Prepared for</div>
                  <div className="display" style={{ fontSize: 24, color: "var(--forest)" }}>{client.name || "—"}</div>
                  {client.cemetery && <div style={{ fontSize: 13, color: "var(--stone)", marginTop: 2 }}>{client.cemetery}</div>}
                  {client.notes && <div style={{ fontSize: 12, color: "var(--stone)", marginTop: 8, fontStyle: "italic", maxWidth: 440 }}>{client.notes}</div>}
                </div>

                {/* Line items */}
                <table style={{ width: "100%", borderCollapse: "collapse", marginBottom: 28 }}>
                  <thead>
                    <tr style={{ borderBottom: "1px solid var(--forest)" }}>
                      <th style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--stone)", textAlign: "left", paddingBottom: 8, fontWeight: 400 }}>Service</th>
                      <th style={{ fontSize: 10, letterSpacing: "0.12em", textTransform: "uppercase", color: "var(--stone)", textAlign: "right", paddingBottom: 8, fontWeight: 400 }}>Amount</th>
                    </tr>
                  </thead>
                  <tbody>
                    {stones.map((st, idx) => {
                      const typeDef = PRICING.stones.find(s => s.id === st.type);
                      const basePrice = (typeDef?.price ?? 0) - (multiDiscount ? MULTI_DISCOUNT : 0);
                      const rows = [];
                      rows.push(
                        <tr key={`stone-${st.id}`} style={{ borderBottom: "1px solid var(--rule)" }}>
                          <td style={{ padding: "12px 0 4px" }}>
                            <div style={{ fontSize: 10, color: "var(--stone)", letterSpacing: "0.1em", textTransform: "uppercase" }}>Stone #{idx + 1} · {typeDef?.label}</div>
                            <div className="display" style={{ fontSize: 18, color: "var(--forest)", marginTop: 2 }}>{st.name.trim() || `${typeDef?.label} Stone`}</div>
                            <div style={{ fontSize: 11, color: "var(--stone)", marginTop: 1 }}>{typeDef?.sub}</div>
                          </td>
                          <td style={{ padding: "12px 0 4px", textAlign: "right", fontFamily: "'Cormorant Garamond', serif", fontSize: 20, color: "var(--forest)" }}>${basePrice}</td>
                        </tr>
                      );
                      st.surcharges.forEach(sid => {
                        const s = PRICING.surcharges.find(s => s.id === sid);
                        rows.push(
                          <tr key={`s-${st.id}-${sid}`} style={{ borderBottom: "1px solid var(--rule)" }}>
                            <td style={{ padding: "6px 0 6px 16px", fontSize: 12, color: "var(--stone)" }}>↳ {s?.label}</td>
                            <td style={{ padding: "6px 0", textAlign: "right", fontSize: 12, color: "var(--stone)" }}>+${s?.price}</td>
                          </tr>
                        );
                      });
                      st.addons.forEach(aid => {
                        const a = PRICING.addons.find(a => a.id === aid);
                        rows.push(
                          <tr key={`a-${st.id}-${aid}`} style={{ borderBottom: "1px solid var(--rule)" }}>
                            <td style={{ padding: "6px 0 6px 16px", fontSize: 12, color: "var(--stone)" }}>↳ {a?.label}</td>
                            <td style={{ padding: "6px 0", textAlign: "right", fontSize: 12, color: "var(--stone)" }}>{a?.price > 0 ? `+$${a.price}` : "Free"}</td>
                          </tr>
                        );
                      });
                      if (st.maintenance) {
                        rows.push(
                          <tr key={`m-${st.id}`} style={{ borderBottom: "1px solid var(--rule)" }}>
                            <td style={{ padding: "6px 0 6px 16px", fontSize: 12, color: "var(--stone)" }}>↳ Annual Maintenance Plan <span style={{ fontStyle: "italic", color: "var(--stone)" }}>(two visits/yr)</span></td>
                            <td style={{ padding: "6px 0", textAlign: "right", fontSize: 12, color: "var(--stone)" }}>${typeDef?.maintenance}/yr</td>
                          </tr>
                        );
                      }
                      if (st.photos.length > 0) {
                        rows.push(
                          <tr key={`p-${st.id}`} style={{ borderBottom: "1px solid var(--rule)", pageBreakInside: "avoid", breakInside: "avoid" }}>
                            <td colSpan={2} style={{ padding: "10px 0 14px 16px" }}>
                              <div style={{ display: "grid", gridTemplateColumns: `repeat(${Math.min(st.photos.length, 4)}, 1fr)`, gap: 6, maxWidth: 460 }}>
                                {st.photos.map(p => (
                                  <div key={p.id} style={{ position: "relative", paddingBottom: "100%", background: "var(--cream)" }}>
                                    <img src={p.dataUrl} alt="" style={{ position: "absolute", inset: 0, width: "100%", height: "100%", objectFit: "cover", border: "1px solid var(--rule)" }} />
                                  </div>
                                ))}
                              </div>
                            </td>
                          </tr>
                        );
                      }
                      return rows;
                    })}

                    {multiDiscount && (
                      <tr style={{ borderBottom: "1px solid var(--rule)" }}>
                        <td style={{ padding: "8px 0", fontSize: 12, color: "var(--stone)", fontStyle: "italic" }}>Multi-stone discount applied (3+ stones, −$10 each)</td>
                        <td style={{ padding: "8px 0", textAlign: "right", fontSize: 12, color: "var(--stone)" }}>−${stones.length * MULTI_DISCOUNT}</td>
                      </tr>
                    )}
                  </tbody>
                </table>

                {/* Total — split between one-time and annual */}
                <div style={{ paddingTop: 16, borderTop: "2px solid var(--forest)" }}>
                  <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline" }}>
                    <span className="eyebrow">One-time total</span>
                    <span className="display" style={{ fontSize: 46, color: "var(--forest)", lineHeight: 1 }}>${oneTimeTotal}</span>
                  </div>
                  {annualTotal > 0 && (
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginTop: 14, paddingTop: 14, borderTop: "1px solid var(--rule)" }}>
                      <div>
                        <span className="eyebrow">Annual maintenance</span>
                        <div style={{ fontSize: 11, color: "var(--stone)", marginTop: 3, maxWidth: 360 }}>Recurring yearly. Two visits per year — spring and fall. Includes cleaning, photos, and priority scheduling.</div>
                      </div>
                      <span className="display" style={{ fontSize: 30, color: "var(--forest)", lineHeight: 1, whiteSpace: "nowrap" }}>${annualTotal}<span style={{ fontSize: 14 }}>/yr</span></span>
                    </div>
                  )}
                </div>

                {/* Footer — scope, payment, next steps */}
                <div style={{ marginTop: 40, paddingTop: 24, borderTop: "1px solid var(--rule)", display: "grid", gridTemplateColumns: "1fr 1fr", gap: 28 }}>
                  <div>
                    <div className="eyebrow" style={{ marginBottom: 6 }}>What's included</div>
                    <p style={{ fontSize: 11, color: "var(--stone)", lineHeight: 1.65, margin: 0 }}>
                      Hand cleaning with D/2 Biological Solution — safe for granite, marble, and slate. Each stone is rinsed, dried, and photographed before and after. Veteran flag placement at no charge where applicable. Lettering restoration, repairs, and resetting are not included.
                    </p>
                  </div>
                  <div>
                    <div className="eyebrow" style={{ marginBottom: 6 }}>Payment</div>
                    <p style={{ fontSize: 11, color: "var(--stone)", lineHeight: 1.65, margin: 0 }}>
                      Jobs under $300 are paid in full after completion. Jobs $300 and over require 50% before work begins and 50% on completion. Cash, check, or card accepted.
                    </p>
                  </div>
                </div>

                <div style={{ marginTop: 24, padding: "18px 22px", background: "var(--cream)", borderLeft: "3px solid var(--gold)" }}>
                  <div className="eyebrow" style={{ marginBottom: 6 }}>To accept this estimate</div>
                  <p style={{ fontSize: 12, color: "var(--forest)", lineHeight: 1.6, margin: 0 }}>
                    Reply by email or call <strong>(631) 604-8002</strong>. Pricing held through <strong>{validUntil}</strong>. Heavy neglect surcharge (+$50/stone) assessed on arrival only if not already noted above.
                  </p>
                </div>

                <div style={{ marginTop: 28, textAlign: "center", fontSize: 10, color: "var(--stone)", letterSpacing: "0.08em" }}>
                  Hampton Headstone Care · hamptonheadstonecare.com · (631) 604-8002
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
